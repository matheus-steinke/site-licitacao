name: Coletor do PNCP

# Busca licitações da área da saúde no PNCP, grava no Supabase e faz a triagem por organização.
# Configuração (uma vez), em Settings > Secrets and variables > Actions:
#   - Secret   SUPABASE_SERVICE_ROLE_KEY: chave "service_role"/"secret" do Supabase
#   - Variable SUPABASE_URL: https://SEU-PROJETO.supabase.co
#   - Variable GOOGLE_CLIENT_ID e Secret GOOGLE_CLIENT_SECRET (opcionais): as mesmas credenciais do
#     Google cadastradas na Vercel. Com elas, o evento da agenda acompanha a data da disputa.
#   - Variable SITE_URL (opcional): endereço público do app, para o link nos eventos.
#   - Variable COLETOR_DIAS_DE_RETENCAO (opcional): depois de quantos dias da disputa os itens das
#     licitações não aprovadas são apagados. Em branco = 30; 0 = nunca apagar.

on:
  schedule:
    # A cada 2 horas (horário UTC), no minuto 17 para fugir do pico da hora cheia.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      fonte:
        description: "De onde descobrir os editais"
        type: choice
        options: [auto, busca, plano_b]
        default: auto
      termos:
        description: "Usar só os N primeiros termos (teste rápido). Em branco = todos."
        required: false
        type: string
      so_triagem:
        description: "Pular a coleta: só refazer a triagem das organizações"
        type: boolean
        default: false

# Nunca duas rodadas ao mesmo tempo: a nova espera a anterior terminar.
concurrency:
  group: coletor-pncp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rodar o coletor
        if: ${{ !inputs.so_triagem }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENTO: ${{ github.event_name }}
          FONTE: ${{ inputs.fonte }}
          TERMOS: ${{ inputs.termos }}
          COLETOR_DIAS_DE_RETENCAO: ${{ vars.COLETOR_DIAS_DE_RETENCAO }}
        run: |
          argumentos=()
          if [ "$EVENTO" = "workflow_dispatch" ]; then argumentos+=(--manual); fi
          case "$FONTE" in busca|plano_b) argumentos+=(--fonte "$FONTE");; esac
          if [[ "$TERMOS" =~ ^[0-9]+$ ]]; then argumentos+=(--termos "$TERMOS"); fi
          pnpm coletor "${argumentos[@]}"

      # Compara as licitações novas ou alteradas com o catálogo de cada organização.
      # Roda mesmo se a coleta terminou com erro: pode haver triagem pendente de antes.
      - name: Triagem por organização
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm triagem

      # Google Agenda e Drive: atualiza o evento quando a data da disputa muda, tira da agenda o
      # que deixou de estar aprovado e termina o envio dos arquivos do edital. Sem as credenciais
      # do Google, o passo só avisa e termina.
      - name: Integrações (Google Agenda e Drive)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm integracoes
